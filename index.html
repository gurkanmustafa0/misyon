 return`<svg viewBox="0 0 ${W} ${H}" class=ch><polyline fill="none" stroke="${col}" stroke-width="2.5" points="${xy.map(a=>a.join(',')).join(' ')}"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="${col}"/>`).join('')}</svg><div class=mut>${v[0]} → ${v[v.length-1]} · min ${mn} · max ${mx}</div>`}
const fl=(a,k,f,[l,ty],ph)=>{const v=esc((S[a][k]||{})[f]??'');return ty=='t'?`<label>${l}<textarea rows=2 oninput="sv('${a}','${k}','${f}',this.value)">${v}</textarea></label>`:`<label>${l}<input type=number inputmode=decimal value="${v}" oninput="sv('${a}','${k}','${f}',this.value)"></label>`};

 let b='';if(ci=='body'){const e=S.body[bd]||{},L=Object.entries(S.body).sort().reverse().slice(0,6);b=`<div class=card><label>Tarih (sabah, aç karnına)<input type=date value="${bd}" onchange="bd=this.value;render()"></label><div class=grid><label>Weight kg<input type=number step=0.1 inputmode=decimal value="${e.w??''}" oninput="sv('body','${bd}','w',this.value)"></label><label>Waist cm<input type=number step=0.1 inputmode=decimal value="${e.c??''}" oninput="sv('body','${bd}','c',this.value)"></label></div><div class=grid style=margin-top:10px><label>Yağ % (tartı)<input type=number step=0.1 inputmode=decimal value="${e.fat??''}" oninput="sv('body','${bd}','fat',this.value)"></label><label>Kas kg (tartı)<input type=number step=0.1 inputmode=decimal value="${e.mus??''}" oninput="sv('body','${bd}','mus',this.value)"></label></div></div><div class=card><table><tr><th>Tarih</th><th>kg</th><th>cm</th><th>yağ%</th></tr>${L.map(x=>`<tr><td>${x[0]}</td><td>${x[1].w||''}</td><td>${x[1].c||''}</td><td>${x[1].fat||''}</td></tr>`).join('')}</table></div>`}
 if(ci=='review'){const k='W'+(rw+1);b=`<div class=card><label>Hafta<select onchange="rw=+this.value;render()">${weeks.map(w=>`<option value=${w.i} ${w.i==rw?'selected':''}>W${w.i+1} · ${w.s}</option>`).join('')}</select></label>${['Best win','Biggest friction','Why did it happen?','ONE adjustment','Next week focus'].map((l,i)=>fl('rev',k,'f'+i,[l,'t'])).join('')}<div class=grid>${fl('rev',k,'en',['Energy 1-5','n'])}${fl('rev',k,'cf',['Confidence 1-5','n'])}</div></div>`}
 if(ci=='bench'){const G=(p,F)=>`<div class=card><h2>${p=='en'?'English speaking (5 dk)':'Drums'}</h2>${p=='en'?'<div class=mut>Aynı prompt: “Explain a complex topic, give your opinion, justify it and give one example.”</div>':''}<div class=grid>${F.map((f,i)=>fl('bench',p+bs,'f'+i,f)).join('')}</div></div>`;
  const cmp=(p,F)=>F.map((f,i)=>f[1]=='n'?`<tr><td>${f[0]}</td>${STG.map(s=>`<td>${(S.bench[p+s]||{})['f'+i]??'·'}</td>`).join('')}</tr>`:'').join('');
  b=`<div class="seg">${STG.map(s=>`<button class="${s==bs?'on b':''}" onclick="bs='${s}';render()">${s}</button>`).join('')}</div>${G('en',BE)}${G('dr',BD)}<div class=card style="overflow:auto"><h2>Karşılaştırma</h2><table><tr><th></th>${STG.map(s=>`<th>${s}</th>`).join('')}</tr>${cmp('en',BE)}${cmp('dr',BD)}</table></div>`}
 return`<h1>Check-in</h1><div class=seg>${tabs.map(t=>`<button class="${t==ci?'on g':''}" onclick="ci='${t}';render()">${{body:'Body',review:'Weekly Review',bench:'Benchmarks'}[t]}</button>`).join('')}</div>${b}`}

function moreV(){const t=[['plan','Program'],['check','Check-in'],['awards','Awards'],['set','Settings']];return`<div class=seg style=margin-top:10px>${t.map(x=>`<button class="${x[0]==mo?'on g':''}" onclick="mo='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`+(mo=='plan'?planV():mo=='check'?check():mo=='awards'?awardsV():setV())}
function awardsV(){const T=totals(),s=streaks(),W=allW(),L=lvl(T.xp),c=C();
 return`<h1>Başarımlar</h1><div class=card><div class=row><span class=big>LV ${L.n}</span><b>${L.t}</b></div>${bar(L.p,1)}<div class=mut>${T.xp} XP${L.nx?' · sonraki level için '+L.nx:''}</div></div>
 <div class=card><h2>Badges</h2><div class=bg>${BG.map(b=>`<div class="bd ${b[2](T,s,W)?'u':''}"><b>${b[0]}</b><br>${b[1]}</div>`).join('')}</div></div>
 <div class=card><h2>Weekly bosses</h2>${W.filter(x=>x.s<=today()).map(x=>`<div class=row><span>W${x.i+1} ${x.boss.n}</span><b class="${x.cleared?'g':'mut'}">${Math.round(x.boss.v*10)/10}/${x.boss.t}${x.cleared?' ✓':''}${x.perfect?' ⭐':''}</b></div>`).join('')}</div>
 ${jan()}`}
function setV(){const c=C(),ai=AI();return`<h1>Ayarlar</h1><div class=card><h2>Diyet planım</h2><textarea rows=4 placeholder="AI puanlamada bunu ölçüt alır. ör. günlük ~1900 kcal, 140 g protein, akşam 20:00'den sonra yemek yok, şekerli içecek yok" onchange="S.plan=this.value;save()">${esc(S.plan||'')}</textarea></div>
 <div class=card><h2>AI</h2>${window.claude?'<div class=mut>Bu sürüm Claude hesabınla çalışır; API anahtarı gerekmez.</div>':`<label>Anthropic API key<input type=password autocomplete=off placeholder="sk-ant-…" value="${esc(ai.key||'')}" onchange="aiSet('key',this.value.trim())"></label><label style=margin-top:8px>Yemek modeli<input value="${esc(ai.model||'claude-haiku-4-5-20251001')}" onchange="aiSet('model',this.value.trim())"></label><label style=margin-top:8px>Coach modeli<input value="${esc(ai.cmodel||'claude-sonnet-5')}" onchange="aiSet('cmodel',this.value.trim())"></label><div class=mut style=margin-top:8px>Anahtar yalnızca bu telefonda saklanır, yedeğe girmez. console.anthropic.com → API keys. Kullanım Claude aboneliğinden ayrı faturalanır.</div>`}<button class="btn s" onclick=aiTest()>Bağlantıyı test et</button><div id=aitest class=mut style="margin-top:8px;white-space:pre-line"></div></div>
 <div class=card><h2>Apple Sağlık · adım</h2><div class=mut>Ana ekran uygulaması Sağlık'a doğrudan erişemez (iOS izin vermez). Yol: Kısayollar'da adımı hesaplayıp panoya kopyalayan bir kısayol yap, sonra Today'de “Panodan yapıştır”a bas. Elle yazmak da olur.</div></div><div class=card><h2>Rules & goals</h2><div class=grid>${RF.map(f=>`<label>${f[1]}<input type=number inputmode=numeric value="${c[f[0]]}" onchange="S.cfg['${f[0]}']=+this.value;save()"></label>`).join('')}</div><div class=mut style="margin-top:8px">Eşik değiştirmek geçmiş günlerin durumunu da yeniden hesaplar. XP tablosu ve level eşikleri sabit.</div></div>
 <div class=card><h2>Veri yedeği</h2><button class="btn s" onclick="bak()">Yedeği kaydet (Dosyalar)</button><label class="btn s" style="display:block;text-align:center">Dosyadan yükle<input type=file accept=".json,application/json" hidden onchange="impF(this)"></label><textarea id=imp rows=2 placeholder="Yedeği buraya yapıştır"></textarea><button class="btn s" onclick="try{S=Object.assign(DEF(),JSON.parse($('#imp').value));save();toast('Yüklendi');render()}catch(e){toast('Geçersiz yedek')}">İçe aktar</button></div>`}

 $('#nav').innerHTML=[['home','home','Bugün'],['today','today','Günlük'],['food','food','Beslenme'],['coach','coach','Koç'],['prog','prog','İlerleme']].map(x=>`<button class="${x[0]==tab?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join('')}
(()=>{const q=new URLSearchParams(location.search),st=q.get('steps'),w=q.get('w'),d=/^\d{4}-\d\d-\d\d$/.test(q.get('d')||'')?q.get('d'):today();if(st!==null&&+st>=0)(S.days[d]=S.days[d]||{}).steps=Math.round(+st);if(w&&+w>0)S.body[d]=Object.assign(S.body[d]||{},{w:String(+w)});if(st!==null||w){save();history.replaceState(null,'',location.pathname)}})();
if(!LSOK&&window.storage)window.storage.get(K).then(r=>{if(r&&r.value){S=Object.assign(DEF(),JSON.parse(r.value));render()}}).catch(()=>{});
if((S.chatv||0)<3){S.chat=[];S.chatv=3;save()}
